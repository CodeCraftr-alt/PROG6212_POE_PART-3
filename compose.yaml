services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${RACEDAY_SQL_PASSWORD:?Set RACEDAY_SQL_PASSWORD first}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 25
  api:
    build:
      context: .
      dockerfile: RaceDay/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RaceDay: "Server=sql,1433;Database=RaceDayPart3;User Id=sa;Password=${RACEDAY_SQL_PASSWORD};TrustServerCertificate=True"
    depends_on:
      sql:
        condition: service_healthy
    ports:
      - "127.0.0.1:5024:8080"
    volumes:
      - images-data:/app/Images
  mvc:
    build:
      context: .
      dockerfile: RaceDay.Mvc/Dockerfile
    environment:
      RaceDayApi__BaseUrl: http://api:8080/
    depends_on:
      - api
    ports:
      - "127.0.0.1:5073:8080"
volumes:
  sql-data:
  images-data:
